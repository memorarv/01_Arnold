<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video QR</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #sound, #replay {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: none;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 16px;
      z-index: 10;
      cursor: pointer;
    }

    #sound {
      bottom: 25px;
    }

    #replay {
      display: none;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline>
    <source src="video.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
  </video>

  <button id="sound">Activar sonido 🔊</button>
  <button id="replay">▶ Reproducir nuevamente</button>

  <script>
    const video = document.getElementById("video");
    const soundButton = document.getElementById("sound");
    const replayButton = document.getElementById("replay");

    // Activar sonido al pulsar el botón
    soundButton.addEventListener("click", async () => {
      video.muted = false;

      try {
        await video.play();
        soundButton.style.display = "none";
      } catch (error) {
        video.muted = true;
        soundButton.textContent = "Toca para activar el sonido 🔊";
      }
    });

    // Mostrar el botón de repetición al finalizar
    video.addEventListener("ended", () => {
      replayButton.style.display = "block";
      soundButton.style.display = "none";
    });

    // Reproducir nuevamente solo cuando la persona lo solicite
    replayButton.addEventListener("click", async () => {
      replayButton.style.display = "none";

      try {
        video.currentTime = 0;
        await video.play();
      } catch (error) {
        replayButton.style.display = "block";
      }
    });
  </script>
</body>
</html>
